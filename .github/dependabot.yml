version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Nuxt 3 系を維持する方針のため、メジャー更新は見送る
      # Nuxt 4 移行（#93）が完了したらこのルールを削除する
      - dependency-name: "nuxt"
        update-types: ["version-update:semver-major"]
      # nuxt-gtag 5.0.0 は Nuxt 4 以上を要求し、Nuxt 3 ではモジュールがサイレント無効化される
      # Nuxt 4 移行（#93）が完了したらこのルールを削除する
      - dependency-name: "nuxt-gtag"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
