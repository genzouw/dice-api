version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # bootstrap-vue-next と @bootstrap-vue-next/nuxt は peer で 1対1 に紐づくため
    # (nuxt 側の peer: bootstrap-vue-next @ 同一 major)、別々の PR で上がると
    # 片方だけマージした時点で npm ci が ERESOLVE で落ちる。常に同一 PR にまとめる。
    groups:
      bootstrap-vue-next:
        patterns:
          - "bootstrap-vue-next"
          - "@bootstrap-vue-next/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
