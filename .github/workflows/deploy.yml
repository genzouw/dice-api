# =============================================================================
# dice-api.genzouw.com デプロイ
# =============================================================================
# main への push で nuxt generate の成果物を S3 へ同期し、CloudFront の
# キャッシュを消す。
#
# 動的な /v1/dice は Lambda が担っており、この経路では触らない (genzouw.com
# リポジトリの terraform/environments/aws/dice-api.tf が管理している)。
# =============================================================================
name: Deploy to S3 and Invalidate CloudFront

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: genzouw-static-content
  S3_PREFIX: dice-api
  CLOUDFRONT_DISTRIBUTION_ID: E1WK9XHHSPQ270

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # ドキュメントページには動的な要素が無いため静的化できる。生成物は
      # .output/public に出る。
      - run: npm run generate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public
          path: .output/public/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC で AWS ロールを引き受けるために必要
      contents: read

    # 本リポジトリは公開されているため、本番デプロイは GitHub Environment 経由に
    # 限定している。この宣言があると OIDC トークンの subject が
    #
    #   repo:genzouw/dice-api:environment:production
    #
    # となり、AWS 側の信頼ポリシーがこの形だけを許可している。environment を
    # 宣言しないワークフローや main 以外のブランチからのワークフローは、
    # デプロイ用ロールを引き受けられない (production 環境のデプロイ可能ブランチを
    # main に限定しているため)。
    #
    # ビルドと分けているのは、ビルドジョブに認証情報を持たせないため。
    # 依存パッケージが侵害されても、この経路からは認証情報を取得できない。
    environment: production

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public
          path: public/

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          # ロール ARN は秘密情報ではないため直接書く (dice-simulator と同じ)。
          # 引き受けられるかは AWS 側の信頼ポリシーが OIDC の subject で判定する。
          role-to-assume: arn:aws:iam::107060754911:role/genzouw-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      # 配信元の S3 バケットは他のサブドメインと共有しているため、自分の
      # プレフィックス配下だけを対象にする。
      #
      # ファイル名にハッシュが入る _nuxt/ 配下は長期キャッシュにできるが、
      # HTML と _payload.json は同じ名前で内容が変わるためキャッシュさせない。
      - name: Deploy to S3
        run: |
          aws s3 sync public/ "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "*.html" \
            --exclude "_payload.json"

          aws s3 sync public/ "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "_payload.json"

      # この distribution は dice-api 専用なので "/*" で問題ない。S3 バケットは
      # 他サブドメインと共有しているが、distribution は共有していない。
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
